databaseChangeLog:
  - changeSet:
      id: 004-create-medication-log-table
      author: elif
      changes:
        - createTable:
            tableName: medication_log
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: medication_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: scheduled_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: given_at
                  type: TIMESTAMP

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: medication_log
            baseColumnNames: medication_id
            referencedTableName: medication
            referencedColumnNames: id
            constraintName: fk_medication_log_medication
            onDelete: CASCADE